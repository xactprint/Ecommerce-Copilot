name: Django Apply Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations to Neon production
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate production database
        run: |
          python - <<'PY'
          import django
          from django.db import connection

          django.setup()

          with connection.cursor() as cursor:
              cursor.execute("SELECT current_database(), current_user")
              database, user = cursor.fetchone()

          print("Database:", database)
          print("Database user:", user)

          assert connection.vendor == "postgresql", "PostgreSQL required"
          assert database == "ecommerce-copilot", "Unexpected database"
          assert user == "ecommerce-copilot_owner", "Unexpected database user"

          print("Production database validation successful.")
          PY

      - name: Display migration plan
        run: python manage.py migrate --plan

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Verify migrations
        run: python manage.py showmigrations
